<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340">
  <rect width="400" height="340" fill="#f7f7f7"/>

  <!-- 1: Lobo frontal (roxo) -->
  <path d="M 70,120
           C 65,80 100,45 150,35
           C 175,30 195,35 205,50
           L 205,150
           L 100,150
           C 80,150 68,140 70,120 Z"
        fill="#7b4fa0" stroke="#3d2a52" stroke-width="2"/>
  <text x="130" y="105" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">1</text>

  <!-- 2: Lobo parietal (verde) -->
  <path d="M 205,50
           C 250,40 290,55 305,90
           C 312,108 308,130 295,150
           L 205,150
           L 205,50 Z"
        fill="#3e9b4f" stroke="#1e4d27" stroke-width="2"/>
  <text x="255" y="105" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">2</text>

  <!-- 3: Lobo temporal (vinho) -->
  <path d="M 100,150
           L 295,150
           C 300,170 295,190 275,200
           C 240,218 150,218 115,200
           C 95,190 92,168 100,150 Z"
        fill="#9c4a6b" stroke="#5c2a3e" stroke-width="2"/>
  <text x="195" y="190" font-size="30" font-weight="bold" fill="#fff" text-anchor="middle">3</text>

  <!-- 4: Lobo occipital (amarelo) -->
  <path d="M 295,150
           C 315,150 328,160 330,175
           C 332,190 322,205 305,210
           C 292,213 278,208 275,200
           C 295,190 300,170 295,150 Z"
        fill="#e0b93c" stroke="#8a6f1e" stroke-width="2"/>
  <text x="305" y="185" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">4</text>

  <!-- 5: Cerebelo (marrom) -->
  <path d="M 210,205
           C 225,200 250,202 265,210
           C 278,217 280,232 268,240
           C 250,250 220,248 208,235
           C 200,225 200,210 210,205 Z"
        fill="#8a5a34" stroke="#4d2f16" stroke-width="2"/>
  <text x="240" y="232" font-size="20" font-weight="bold" fill="#e02020" text-anchor="middle">5</text>

  <!-- Tronco encefálico (pequeno, apenas contexto visual) -->
  <path d="M 230,235 C 232,255 238,270 248,280 L 262,280 C 260,260 255,245 250,238 Z"
        fill="#c9a07a" stroke="#6b4a2e" stroke-width="1.5"/>

  <text x="200" y="325" font-size="15" fill="#333" text-anchor="middle">Vista lateral do encéfalo — lobos numerados (1 a 5)</text>
</svg>
